<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  
  <title>おかずレシピ | Royal Links</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-rich: #c59b27;
      --text-royal: #4a3423;
      --text-sub: #7d624c;
      --card-bg: rgba(255, 255, 255, 0.72);
      --card-border: rgba(212, 175, 55, 0.4);
      --card-shadow: 0 12px 30px rgba(230, 160, 80, 0.12), 0 0 20px rgba(255, 255, 255, 0.9);
      --card-shadow-hover: 0 18px 40px rgba(212, 175, 55, 0.28), 0 0 25px rgba(255, 220, 130, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #ffffff 0%, #fff7ed 35%, #ffebd9 70%, #ffd8be 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 16px;
      color: var(--text-royal);
      position: relative;
      overflow-x: hidden;
    }

    #particle-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      position: relative;
      z-index: 1;
    }

    /* プロフィール */
    .profile-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .avatar-frame {
      position: relative;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #ffffff 0%, #ffd700 50%, #fff1a8 100%);
      box-shadow: 0 0 25px rgba(255, 200, 100, 0.45);
      animation: float 4.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 3px solid #ffffff;
      overflow: hidden;
      background: #ffffff;
    }

    .avatar { width: 100%; height: 100%; object-fit: cover; display: block; }

    .fox-emblem {
      position: absolute;
      bottom: 0px; right: 0px;
      background: linear-gradient(135deg, #ff8c42, #ff5e36);
      color: #ffffff;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 10px rgba(255, 110, 60, 0.35);
      display: flex; align-items: center; gap: 4px;
      font-weight: 700;
    }

    .name-container { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .sub-title { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-style: italic; color: var(--gold-rich); letter-spacing: 0.12em; }
    .name { font-size: 1.7rem; font-weight: 900; color: var(--text-royal); letter-spacing: 0.05em; }

    .bio {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.6;
      max-width: 90%;
      background: rgba(255, 255, 255, 0.55);
      padding: 10px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
    }

    /* カルーセル */
    .pickup-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--text-royal);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-tag {
      font-size: 0.75rem;
      color: var(--gold-rich);
      font-weight: 700;
      background: rgba(255, 255, 255, 0.8);
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .carousel-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 6px 6px 14px 6px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .carousel-container::-webkit-scrollbar { display: none; }

    .pickup-card {
      flex: 0 0 170px;
      scroll-snap-align: start;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 22px;
      border: 1.5px solid var(--card-border);
      padding: 10px;
      text-decoration: none;
      color: var(--text-royal);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .pickup-card:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: #ffd700;
      box-shadow: var(--card-shadow-hover);
      background: rgba(255, 255, 255, 0.9);
    }

    .pickup-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: #fdfaf7;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .pickup-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      display: block;
    }

    .pickup-card:hover .pickup-img { transform: scale(1.08); }

    .img-badge {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 8px;
      display: flex; align-items: center; gap: 3px;
      backdrop-filter: blur(4px);
    }

    .pickup-type { font-size: 0.72rem; color: var(--text-sub); font-weight: 700; }

    .pickup-title-row { display: flex; align-items: center; gap: 4px; }

    .r18-badge {
      background: #ff4757;
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .pickup-title {
      font-size: 0.88rem;
      font-weight: 900;
      color: var(--text-royal);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .pickup-meta { font-size: 0.7rem; color: #997860; }

    .loading-msg {
      font-size: 0.85rem;
      color: var(--gold-rich);
      padding: 20px;
      text-align: center;
      width: 100%;
    }

    /* リンク一覧 */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 18px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 50px;
      border: 1.5px solid var(--card-border);
      text-decoration: none;
      color: var(--text-royal);
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .link-card::before {
      content: '';
      position: absolute;
      top: -50%; left: -130%;
      width: 80%; height: 200%;
      background: linear-gradient(60deg, rgba(255,255,255,0) 20%, rgba(255, 248, 220, 0.8) 50%, rgba(255,255,255,0) 80%);
      transform: rotate(25deg);
      transition: 0.75s;
    }

    .link-card:hover {
      transform: translateY(-4px) scale(1.02);
      background: rgba(255, 255, 255, 0.92);
      border-color: #ffd700;
      box-shadow: var(--card-shadow-hover);
    }

    .link-card:hover::before { left: 140%; }

    .card-thumb-wrapper {
      width: 52px; height: 52px;
      flex-shrink: 0;
      padding: 2px;
      background: linear-gradient(135deg, #ffd700, #ffb347);
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(229, 169, 60, 0.25);
    }

    .card-thumb {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      display: block;
    }

    .card-content { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; }
    .card-title { font-size: 1.02rem; font-weight: 700; color: var(--text-royal); }
    .card-desc { font-size: 0.78rem; color: var(--text-sub); }

    .card-arrow {
      width: 34px; height: 34px;
      background: #ffffff;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      color: var(--gold-rich);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .link-card:hover .card-arrow {
      background: var(--gold-rich);
      color: #fff;
      transform: rotate(360deg);
    }

    .footer {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 700;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <!-- プロフィール -->
    <div class="profile-card">
      <div class="avatar-frame">
        <div class="avatar-inner">
          <img class="avatar" src="https://embed.pixiv.net/user_profile.php?id=87842624&k=0e13ecda8b712eecf75d5a74314e84fc" alt="おかずレシピ">
        </div>
        <span class="fox-emblem"><i class="fa-solid fa-paw"></i> Fox Sweets</span>
      </div>

      <div class="name-container">
        <div class="sub-title">Patisserie &amp; Atelier</div>
        <h1 class="name">おかずレシピ <i class="fa-solid fa-cookie-bite" style="color: #ff9357; font-size: 1.2rem;"></i></h1>
      </div>

      <p class="bio">
        AIによる肥満少女を投稿します！🦊🍰<br>
        マンガ・小説・ゲームもゆるりと制作中。
      </p>
    </div>

    <!-- ✨ Pixivリアルタイム自動取得 カルーセル -->
    <div class="pickup-section">
      <div class="section-header">
        <div class="section-title">
          <i class="fa-solid fa-sparkles" style="color: #d4af37;"></i> ピックアップ作品
        </div>
        <span class="section-tag">スワイプで閲覧 ➔</span>
      </div>

      <!-- ここにPixivのピックアップが自動で挿入されます -->

      </div>
    </div>

    <!-- 🔗 メインリンク一覧 -->
    <div class="links-list">
      
      <!-- Pixiv -->
      <a href="https://www.pixiv.net/users/87842624" target="_blank" rel="noopener" class="link-card">
        <div class="card-thumb-wrapper">
          <img src="https://embed.pixiv.net/user_profile.php?id=87842624&k=0e13ecda8b712eecf75d5a74314e84fc" class="card-thumb" alt="Pixiv">
        </div>

        </div>

      <!-- X (Twitter) -->
      <a href="https://twitter.com/recipe768" target="_blank" rel="noopener" class="link-card">

      <!-- Civitai -->

    </div>

    <!-- フッター -->
    <div class="footer">
      &copy; 2025 おかずレシピ. All Rights Reserved. ✦
    </div>
  </div>

  <!-- Pixivピックアップ自動取得＆レンダリングスクリプト -->
  <script>
    const PIXIV_USER_ID = "87842624";
    const container = document.getElementById('pixiv-pickup-container');

    async function loadPixivPickup() {
      try {
        // 無料の公開CORSプロキシを経由してHTMLを取得
        const targetUrl = `https://www.pixiv.net/users/${PIXIV_USER_ID}`;
        const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
        
        const response = await fetch(proxyUrl);
        const data = await response.json();
        
        const parser = new DOMParser();
        const doc = parser.parseFromString(data.contents, 'text/html');

        // ピックアップセクション内のリストアイテムをすべて取得
        const pickupItems = doc.querySelectorAll('section ul li');
        
        if (!pickupItems || pickupItems.length === 0) {
          throw new Error('ピックアップ作品が見つかりませんでした');
        }

        container.innerHTML = ''; // ローディングメッセージをクリア

        pickupItems.forEach(item => {
          const typeEl = item.querySelector('div');
          const type = typeEl ? typeEl.textContent.trim() : '作品';

          const linkEl = item.querySelector('a[href*="/artworks/"], a[href*="/novel/show.php"]');
          if (!linkEl) return;
          
          let href = linkEl.getAttribute('href');
          if (!href.startsWith('http')) {
            href = 'https://www.pixiv.net' + href;
          }

          // サムネイル画像
          const imgEl = item.querySelector('img');
          let imgSrc = imgEl ? imgEl.getAttribute('src') : '';
          
          // 画像の中継プロキシ（images.weserv.nl）を通してPixivのブロックを回避
          if (imgSrc.startsWith('http')) {
            imgSrc = `https://images.weserv.nl/?url=${encodeURIComponent(imgSrc)}`;
          }

          // タイトル
          let title = '';
          const titleLink = item.querySelector('a[href*="/artworks/"]:not([data-ga4-label="thumbnail_link"]), a[href*="/novel/show.php"]:not([data-ga4-label="thumbnail_link"])');
          if (titleLink) {
            title = titleLink.textContent.trim();
          } else if (imgEl && imgEl.getAttribute('alt')) {
            title = imgEl.getAttribute('alt').replace(/ - おかずレシピの.*$/, '').replace(/^#.*? /, '');
          }

          // R-18判定
          const isR18 = item.textContent.includes('R-18') || item.textContent.includes('R-18G');
          const r18Text = item.textContent.includes('R-18G') ? 'R-18G' : 'R-18';

          // ページ数 / 文字数の取得
          let metaText = '';
          const countEl = item.querySelector('span:has(svg) + span, div:has(svg) + span');
          if (countEl && countEl.textContent.trim()) {
            metaText = `${countEl.textContent.trim()} ページ`;
          } else {
            const textMatch = item.textContent.match(/([0-9,]+文字)/);
            if (textMatch) metaText = textMatch[1];
          }

          // カルーセルカードHTMLを生成
          const card = document.createElement('a');
          card.href = href;
          card.target = '_blank';
          card.rel = 'noopener';
          card.className = 'pickup-card';

          card.innerHTML = `
            <div class="pickup-img-wrapper">
              <img src="${imgSrc}" class="pickup-img" alt="${title}" loading="lazy">
              ${countEl ? `<span class="img-badge"><i class="fa-solid fa-images"></i> ${countEl.textContent.trim()}</span>` : ''}
            </div>
            <div class="pickup-type">${type}</div>
            <div class="pickup-title-row">
              ${isR18 ? `<span class="r18-badge">${r18Text}</span>` : ''}
              <span class="pickup-title" title="${title}">${title}</span>
            </div>
            ${metaText ? `<div class="pickup-meta">${metaText}</div>` : ''}
          `;

          container.appendChild(card);
        });

      } catch (err) {
        console.error(err);
        container.innerHTML = `<div class="loading-msg" style="color:#d9534f;">作品情報の取得に失敗しました。<br><a href="https://www.pixiv.net/users/${PIXIV_USER_ID}" target="_blank" style="color:var(--gold-rich);">Pixivで直接見る ➔</a></div>`;
      }
    }

    loadPixivPickup();
  </script>

  <!-- キラキラ星屑スクリプト -->
  <script>
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    let pList = [];
    function pResize() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
    window.addEventListener('resize', pResize);
    pResize();

    class SparkleParticle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * pCanvas.width;
        this.y = Math.random() * pCanvas.height;
        this.size = Math.random() * 2.8 + 1.2;
        this.maxAlpha = Math.random() * 0.7 + 0.3;
        this.alpha = 0;
        this.fadeSpeed = Math.random() * 0.015 + 0.005;
        this.growing = true;
        this.speedY = -(Math.random() * 0.35 + 0.1);
        this.isStar = Math.random() > 0.6;
      }
      update() {
        this.y += this.speedY;
        if (this.growing) {
          this.alpha += this.fadeSpeed;
          if (this.alpha >= this.maxAlpha) this.growing = false;
        } else {
          this.alpha -= this.fadeSpeed;
          if (this.alpha <= 0) this.reset();
        }
        if (this.y < -10) this.reset();
      }
      draw() {
        pCtx.save();
        pCtx.translate(this.x, this.y);
        pCtx.fillStyle = `rgba(255, 225, 130, ${this.alpha})`;
        pCtx.shadowBlur = 8;
        pCtx.shadowColor = `rgba(255, 215, 0, ${this.alpha})`;
        if (this.isStar) {
          pCtx.beginPath();
          for (let i = 0; i < 4; i++) {
            pCtx.lineTo(0, -this.size * 2);
            pCtx.rotate(Math.PI / 4);
            pCtx.lineTo(0, -this.size * 0.5);
            pCtx.rotate(Math.PI / 4);
          }
          pCtx.fill();
        } else {
          pCtx.beginPath();
          pCtx.arc(0, 0, this.size, 0, Math.PI * 2);
          pCtx.fill();
        }
        pCtx.restore();
      }
    }

    for (let i = 0; i < 35; i++) pList.push(new SparkleParticle());
    function pAnimate() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      pList.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(pAnimate);
    }
    pAnimate();
  </script>
</body>
</html>
