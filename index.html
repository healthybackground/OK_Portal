<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  
  <title>おかずレシピ | Royal Links</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=Zen+Maru+Gothic:wght@500;700;900&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --gold-primary: #d4af37;
      --gold-rich: #c59b27;
      --text-royal: #4a3423;
      --text-sub: #7d624c;
      --card-bg: rgba(255, 255, 255, 0.75);
      --card-border: rgba(212, 175, 55, 0.4);
      --card-shadow: 0 12px 30px rgba(230, 160, 80, 0.12), 0 0 20px rgba(255, 255, 255, 0.9);
      --card-shadow-hover: 0 18px 40px rgba(212, 175, 55, 0.28), 0 0 25px rgba(255, 220, 130, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Zen Maru Gothic', sans-serif;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 10%, #ffffff 0%, #fff7ed 35%, #ffebd9 70%, #ffd8be 100%);
      background-attachment: fixed;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 50px 16px;
      color: var(--text-royal);
      position: relative;
      overflow-x: hidden;
    }

    #particle-canvas {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      position: relative;
      z-index: 1;
    }

    /* プロフィール */
    .profile-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .avatar-frame {
      position: relative;
      width: 125px;
      height: 125px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, #ffffff 0%, #ffd700 50%, #fff1a8 100%);
      box-shadow: 0 0 25px rgba(255, 200, 100, 0.45);
      animation: float 4.5s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .avatar-inner {
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 3px solid #ffffff;
      overflow: hidden;
      background: #fff3e6;
    }

    .avatar { width: 100%; height: 100%; object-fit: cover; display: block; }

    .fox-emblem {
      position: absolute;
      bottom: 0px; right: 0px;
      background: linear-gradient(135deg, #ff8c42, #ff5e36);
      color: #ffffff;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      border: 2px solid #ffffff;
      box-shadow: 0 4px 10px rgba(255, 110, 60, 0.35);
      display: flex; align-items: center; gap: 4px;
      font-weight: 700;
    }

    .name-container { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .sub-title { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; font-style: italic; color: var(--gold-rich); letter-spacing: 0.12em; }
    .name { font-size: 1.7rem; font-weight: 900; color: var(--text-royal); letter-spacing: 0.05em; }

    .bio {
      font-size: 0.88rem;
      color: var(--text-sub);
      line-height: 1.6;
      max-width: 90%;
      background: rgba(255, 255, 255, 0.6);
      padding: 10px 18px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(8px);
    }

    /* ✨ おすすめ作品 カルーセル */
    .works-section {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 8px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 900;
      color: var(--text-royal);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .section-tag {
      font-size: 0.75rem;
      color: var(--gold-rich);
      font-weight: 700;
      background: rgba(255, 255, 255, 0.8);
      padding: 2px 10px;
      border-radius: 12px;
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .carousel-container {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 6px 6px 14px 6px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      min-height: 220px;
      align-items: center;
    }
    .carousel-container::-webkit-scrollbar { display: none; }

    .work-card {
      flex: 0 0 170px;
      scroll-snap-align: start;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 22px;
      border: 1.5px solid var(--card-border);
      padding: 10px;
      text-decoration: none;
      color: var(--text-royal);
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .work-card:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: #ffd700;
      box-shadow: var(--card-shadow-hover);
      background: rgba(255, 255, 255, 0.95);
    }

    .work-img-wrapper {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      background: #fdfaf7;
      border: 1px solid rgba(255, 255, 255, 0.8);
    }

    .work-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
      display: block;
    }

    .work-card:hover .work-img { transform: scale(1.08); }

    /* ✨ 小説用・金箔押し文庫本風カバー（常に美しく表示） */
    .novel-book-cover {
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 30% 20%, #ffffff 0%, #fff2e0 60%, #ffdcb8 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 14px 10px;
      text-align: center;
      border: 1.5px solid rgba(212, 175, 55, 0.5);
      border-radius: 14px;
      box-sizing: border-box;
      position: relative;
      box-shadow: inset 0 0 12px rgba(212, 175, 55, 0.15);
    }

    .novel-book-cover::before {
      content: '';
      position: absolute;
      inset: 4px;
      border: 1px dashed rgba(212, 175, 55, 0.4);
      border-radius: 10px;
      pointer-events: none;
    }

    .novel-book-icon {
      font-size: 1.6rem;
      color: var(--gold-rich);
      margin-bottom: 6px;
      filter: drop-shadow(0 2px 4px rgba(212, 175, 55, 0.3));
    }

    .novel-book-title {
      font-family: 'Shippori Mincho', serif;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-royal);
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      text-shadow: 0 1px 2px rgba(255,255,255,0.8);
      z-index: 1;
    }

    .img-badge {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 8px;
      display: flex; align-items: center; gap: 3px;
      backdrop-filter: blur(4px);
    }

    .work-type { font-size: 0.72rem; color: var(--text-sub); font-weight: 700; }
    .work-title-row { display: flex; align-items: center; gap: 4px; }

    .r18-badge {
      background: #ff4757;
      color: #ffffff;
      font-size: 0.65rem;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 6px;
      flex-shrink: 0;
    }

    .work-title {
      font-size: 0.88rem;
      font-weight: 900;
      color: var(--text-royal);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .work-meta { font-size: 0.7rem; color: #997860; }

    /* 🔗 リンク一覧 */
    .links-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 18px;
      background: var(--card-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 50px;
      border: 1.5px solid var(--card-border);
      text-decoration: none;
      color: var(--text-royal);
      box-shadow: var(--card-shadow);
      position: relative;
      overflow: hidden;
      transition: all 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .link-card:hover {
      transform: translateY(-4px) scale(1.02);
      background: rgba(255, 255, 255, 0.95);
      border-color: #ffd700;
      box-shadow: var(--card-shadow-hover);
    }

    .card-thumb-wrapper {
      width: 52px; height: 52px;
      flex-shrink: 0;
      padding: 2px;
      background: linear-gradient(135deg, #ffd700, #ffb347);
      border-radius: 50%;
    }

    .card-thumb {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #ffffff;
      display: block;
      background: #fff;
    }

    .card-content { flex-grow: 1; display: flex; flex-direction: column; gap: 2px; }
    .card-title { font-size: 1.02rem; font-weight: 700; color: var(--text-royal); }
    .card-desc { font-size: 0.78rem; color: var(--text-sub); }

    .card-arrow {
      width: 34px; height: 34px;
      background: #ffffff;
      border: 1px solid rgba(212, 175, 55, 0.35);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem;
      color: var(--gold-rich);
      transition: all 0.3s ease;
      flex-shrink: 0;
    }

    .link-card:hover .card-arrow {
      background: var(--gold-rich);
      color: #fff;
    }

    .footer {
      font-size: 0.8rem;
      color: var(--text-sub);
      font-weight: 700;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <!-- プロフィール -->
    <div class="profile-card">
      <div class="avatar-frame">
        <div class="avatar-inner">
          <img id="main-avatar" class="avatar" 
               src="https://embed.pixiv.net/user_profile.php?id=87842624" 
               onerror="this.src='https://embed.pixiv.net/user_profile.php?id=87842624'" 
               alt="おかずレシピ">
        </div>
        <span class="fox-emblem"><i class="fa-solid fa-paw"></i> 日本家屋で睡眠中</span>
      </div>

      <div class="name-container">
        <div class="sub-title">Patisserie &amp; Atelier</div>
        <h1 class="name">おかずレシピ <i class="fa-solid fa-cookie-bite" style="color: #ff9357; font-size: 1.2rem;"></i></h1>
      </div>

      <p class="bio">
        AIによる肥満少女を投稿します！🦊🍰<br>
        マンガ・小説・ゲームもゆるく制作中。
      </p>
    </div>

    <!-- ✨ おすすめ作品 カルーセル -->
    <div class="works-section">
      <div class="section-header">
        <div class="section-title">
          <i class="fa-solid fa-sparkles" style="color: #d4af37;"></i> おすすめ作品
        </div>
        <span class="section-tag">スワイプで閲覧 ➔</span>
      </div>

      <div class="carousel-container" id="pixiv-works-container">
        <!-- pickup.json から自動描画 -->
      </div>
    </div>

    <!-- 🔗 メインリンク一覧 -->
    <div class="links-list">
      
      <!-- Pixiv -->
      <a href="https://www.pixiv.net/users/87842624" target="_blank" rel="noopener" class="link-card">
        <div class="card-thumb-wrapper">
          <img id="pixiv-card-thumb" 
               src="https://embed.pixiv.net/user_profile.php?id=87842624" 
               onerror="this.src='https://embed.pixiv.net/user_profile.php?id=87842624'" 
               class="card-thumb" alt="Pixiv">
        </div>
        <div class="card-content">
          <div class="card-title">Pixiv</div>
          <div class="card-desc">イラスト・小説・まとめ作品を掲載中</div>
        </div>
        <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
      </a>

      <!-- X (Twitter) -->
      <a href="https://twitter.com/recipe768" target="_blank" rel="noopener" class="link-card">
        <div class="card-thumb-wrapper">
          <img src="https://unavatar.io/x/recipe768" class="card-thumb" alt="X">
        </div>
        <div class="card-content">
          <div class="card-title">X (旧Twitter)</div>
          <div class="card-desc">最新情報・メイン投稿場所。@recipe768</div>
        </div>
        <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
      </a>

      <!-- Civitai -->
      <a href="https://civitai.com/user/Okazu_recipe" target="_blank" rel="noopener" class="link-card">
        <div class="card-thumb-wrapper">
          <img src="https://civitai.com/favicon.ico" class="card-thumb" alt="Civitai">
        </div>
        <div class="card-content">
          <div class="card-title">Civitai</div>
          <div class="card-desc">AIモデル・LoRAの配布先</div>
        </div>
        <div class="card-arrow"><i class="fa-solid fa-chevron-right"></i></div>
      </a>

    </div>

    <!-- フッター -->
    <div class="footer">
      &copy; 2026 おかずレシピ
    </div>
  </div>

  <!-- ✨ 小説完全自動カバー変換スクリプト -->
  <script>
    const container = document.getElementById('pixiv-works-container');
    const mainAvatar = document.getElementById('main-avatar');
    const pixivCardThumb = document.getElementById('pixiv-card-thumb');

    async function loadData() {
      try {
        const res = await fetch('./pickup.json?' + new Date().getTime());
        if (!res.ok) return;
        const data = await res.json();

        if (data.avatar && !data.avatar.includes('wsrv.nl/?url=https%3A%2F%2Fembed.pixiv.net')) {
          mainAvatar.src = data.avatar;
          pixivCardThumb.src = data.avatar;
        }

        if (data.pickup && data.pickup.length > 0) {
          container.innerHTML = '';
          data.pickup.forEach(item => {
            const card = document.createElement('a');
            card.href = item.href;
            card.target = '_blank';
            card.rel = 'noopener';
            card.className = 'work-card';

            const isNovel = item.type === '小説作品' || item.href.includes('/novel/');

            // 小説作品はすべて「金箔押し文庫本風カバー」に統一して置き換え
            let coverHtml = '';
            if (isNovel) {
              coverHtml = `
                <div class="novel-book-cover">
                  <i class="fa-solid fa-book-open novel-book-icon"></i>
                  <div class="novel-book-title">${item.title}</div>
                </div>
              `;
            } else {
              coverHtml = `
                <img src="${item.img}" class="work-img" alt="${item.title}" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'novel-book-cover\\'><i class=\\'fa-solid fa-image novel-book-icon\\'></i><div class=\\'novel-book-title\\'>${item.title}</div></div>'">
                ${item.pages > 1 ? `<span class="img-badge"><i class="fa-solid fa-images"></i> ${item.pages}</span>` : ''}
              `;
            }

            card.innerHTML = `
              <div class="work-img-wrapper">${coverHtml}</div>
              <div class="work-type">${item.type}</div>
              <div class="work-title-row">
                ${item.r18 ? `<span class="r18-badge">${item.r18}</span>` : ''}
                <span class="work-title" title="${item.title}">${item.title}</span>
              </div>
              ${item.meta ? `<div class="work-meta">${item.meta}</div>` : ''}
            `;
            container.appendChild(card);
          });
        }
      } catch (e) {
        console.log('JSON standby');
      }
    }
    loadData();
  </script>

  <!-- パーティクル -->
  <script>
    const pCanvas = document.getElementById('particle-canvas');
    const pCtx = pCanvas.getContext('2d');
    let pList = [];
    function pResize() { pCanvas.width = window.innerWidth; pCanvas.height = window.innerHeight; }
    window.addEventListener('resize', pResize);
    pResize();

    class SparkleParticle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * pCanvas.width;
        this.y = Math.random() * pCanvas.height;
        this.size = Math.random() * 2.8 + 1.2;
        this.maxAlpha = Math.random() * 0.7 + 0.3;
        this.alpha = 0;
        this.fadeSpeed = Math.random() * 0.015 + 0.005;
        this.growing = true;
        this.speedY = -(Math.random() * 0.35 + 0.1);
        this.isStar = Math.random() > 0.6;
      }
      update() {
        this.y += this.speedY;
        if (this.growing) {
          this.alpha += this.fadeSpeed;
          if (this.alpha >= this.maxAlpha) this.growing = false;
        } else {
          this.alpha -= this.fadeSpeed;
          if (this.alpha <= 0) this.reset();
        }
        if (this.y < -10) this.reset();
      }
      draw() {
        pCtx.save();
        pCtx.translate(this.x, this.y);
        pCtx.fillStyle = `rgba(255, 225, 130, ${this.alpha})`;
        pCtx.shadowBlur = 8;
        pCtx.shadowColor = `rgba(255, 215, 0, ${this.alpha})`;
        if (this.isStar) {
          pCtx.beginPath();
          for (let i = 0; i < 4; i++) {
            pCtx.lineTo(0, -this.size * 2);
            pCtx.rotate(Math.PI / 4);
            pCtx.lineTo(0, -this.size * 0.5);
            pCtx.rotate(Math.PI / 4);
          }
          pCtx.fill();
        } else {
          pCtx.beginPath();
          pCtx.arc(0, 0, this.size, 0, Math.PI * 2);
          pCtx.fill();
        }
        pCtx.restore();
      }
    }

    for (let i = 0; i < 35; i++) pList.push(new SparkleParticle());
    function pAnimate() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      pList.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(pAnimate);
    }
    pAnimate();
  </script>
</body>
</html>
