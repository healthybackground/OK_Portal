name: Pixiv Pickup Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *' # 15分ごとに自動同期
  workflow_dispatch:      # 手動実行ボタン
  push:
    branches: [ main, master ]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Pixiv Pickup Works via Ajax
        run: |
          node -e '
          async function run() {
            const fs = require("fs");
            const userId = "87842624";
            const apiUrl = `https://www.pixiv.net/ajax/user/${userId}/profile/top?lang=ja`;

            const res = await fetch(apiUrl, {
              headers: {
                "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
                "Referer": `https://www.pixiv.net/users/${userId}`,
                "Accept": "application/json",
                "Accept-Language": "ja,en-US;q=0.9,en;q=0.8",
                "Cookie": "p_ab_d_id=1272411874; p_ab_id=0; p_ab_id_2=0; adult_check=1; age_gate=1; user_id=87842624;"
              }
            });

            if (!res.ok) {
              console.error("HTTP Error:", res.status);
              process.exit(1);
            }

            const data = await res.json();
            const body = data.body || {};

            // Ajax APIから返ってくる「pickup（ピックアップ）」配列を抽出
            const rawPickup = body.pickup || [];
            console.log("Found pickup works count:", rawPickup.length);

            const pickup = rawPickup.map(item => {
              const isNovel = item.workType === "novel" || item.novelId || item.textCount || item.wordCount;
              const href = isNovel 
                ? `https://www.pixiv.net/novel/show.php?id=${item.id}`
                : `https://www.pixiv.net/artworks/${item.id}`;

              const isR18 = item.xRestrict === 1 ? "R-18" : (item.xRestrict === 2 ? "R-18G" : "");
              
              // 文字数 / 枚数
              let meta = "";
              if (isNovel) {
                const words = item.wordCount || item.textCount || item.characterCount;
                meta = words ? `${words.toLocaleString()}文字` : "";
              } else {
                const pages = item.pageCount;
                meta = pages ? `イラスト ${pages}枚` : "";
              }

              // サムネイル画像
              let img = "";
              let rawUrl = item.url || item.profileImageUrl || "";
              if (isNovel) {
                // 小説：表紙がある場合のみ設定
                if (rawUrl && !rawUrl.includes("default") && !rawUrl.includes("no-image")) {
                  img = `https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}`;
                }
              } else {
                // イラスト：高解像度プロキシ
                img = item.id ? `https://pixiv.cat/${item.id}.jpg` : (rawUrl ? `https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}` : "");
              }

              return {
                id: item.id,
                title: item.title || "無題",
                type: isNovel ? "小説作品" : "イラスト作品",
                href,
                img,
                r18: isR18,
                pages: item.pageCount || 1,
                meta
              };
            });

            // プロフィールアバター
            const avatarRaw = body.extraData?.meta?.ogp?.image || body.userData?.profileImgBig || body.userData?.profileImg || "";
            const avatar = avatarRaw ? `https://wsrv.nl/?url=${encodeURIComponent(avatarRaw)}` : `https://embed.pixiv.net/user_profile.php?id=${userId}`;

            const result = {
              avatar,
              pickup
            };

            fs.writeFileSync("pickup.json", JSON.stringify(result, null, 2));
            console.log("Successfully updated pickup.json with pickup works.");
          }

          run().catch(err => {
            console.error("Error:", err);
            process.exit(1);
          });
          '

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pickup.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto sync Pixiv pickup"
          git push
