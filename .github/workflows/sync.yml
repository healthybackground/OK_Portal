name: Pixiv Pickup Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *' # 15分ごとに自動更新
  workflow_dispatch:      # 手動更新ボタン
  push:
    branches: [ main, master ]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Pixiv Data via Ajax API
        run: |
          node -e '
          async function run() {
            const fs = require("fs");
            const userId = "87842624";
            const apiUrl = `https://www.pixiv.net/ajax/user/${userId}/profile/top?lang=ja`;

            const res = await fetch(apiUrl, {
              headers: {
                "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36",
                "Referer": `https://www.pixiv.net/users/${userId}`,
                "Accept": "application/json",
                "Cookie": "p_ab_d_id=1272411874; user_id=87842624; first_visit_datetime_pc=2024-05-01;"
              }
            });

            if (!res.ok) {
              console.error("HTTP Error:", res.status, res.statusText);
              process.exit(1);
            }

            const data = await res.json();
            const body = data.body || {};

            // 1. ピックアップ配列を取得（空の場合は最新作品から自動生成）
            let rawList = body.pickup || [];

            // 万が一未ログイン判定で pickup が空の場合は、最新のイラスト・小説からピックアップ
            if (rawList.length === 0) {
              console.log("Pickup array empty, falling back to top works...");
              const illusts = Object.values(body.illusts || {});
              const novels = Object.values(body.novels || {});
              rawList = [...novels.slice(0, 1), ...illusts.slice(0, 3)];
            }

            const pickup = rawList.map(item => {
              const isNovel = item.workType === "novel" || item.novelId || item.textCount || item.wordCount;
              const href = isNovel 
                ? `https://www.pixiv.net/novel/show.php?id=${item.id}`
                : `https://www.pixiv.net/artworks/${item.id}`;

              const isR18 = item.xRestrict === 1 ? "R-18" : (item.xRestrict === 2 ? "R-18G" : "");
              
              let meta = "";
              if (isNovel) {
                const words = item.wordCount || item.textCount || item.characterCount;
                meta = words ? `${words.toLocaleString()}文字` : "";
              } else {
                const pages = item.pageCount;
                meta = pages ? `イラスト ${pages}枚` : "";
              }

              // 画像URLの生成
              let img = "";
              let rawUrl = item.url || item.profileImageUrl || "";
              if (isNovel) {
                if (rawUrl && !rawUrl.includes("default") && !rawUrl.includes("no-image")) {
                  img = `https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}`;
                }
              } else {
                img = item.id ? `https://pixiv.cat/${item.id}.jpg` : (rawUrl ? `https://wsrv.nl/?url=${encodeURIComponent(rawUrl)}` : "");
              }

              return {
                id: item.id,
                title: item.title || "無題",
                type: isNovel ? "小説作品" : "イラスト作品",
                href,
                img,
                r18: isR18,
                pages: item.pageCount || 1,
                meta
              };
            });

            // 2. アバター画像
            const avatarRaw = body.extraData?.meta?.ogp?.image || body.userData?.profileImgBig || body.userData?.profileImg || "";
            const avatar = avatarRaw ? `https://wsrv.nl/?url=${encodeURIComponent(avatarRaw)}` : `https://embed.pixiv.net/user_profile.php?id=${userId}`;

            const result = {
              avatar,
              pickup
            };

            fs.writeFileSync("pickup.json", JSON.stringify(result, null, 2));
            console.log("Successfully generated pickup.json with " + pickup.length + " works.");
          }

          run().catch(err => {
            console.error("Fatal Error:", err);
            process.exit(1);
          });
          '

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pickup.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto sync Pixiv pickup"
          git push
