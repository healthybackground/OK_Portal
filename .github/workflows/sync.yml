name: Pixiv Pickup Auto Sync

on:
  schedule:
    - cron: '*/15 * * * *' # 15分ごとに自動更新
  workflow_dispatch:      # 手動更新ボタン
  push:
    branches: [ main, master ]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch Latest Pixiv Pickup from HTML
        run: |
          node -e '
          const https = require("https");
          const fs = require("fs");

          const url = "https://www.pixiv.net/users/87842624";
          const options = {
            headers: {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept-Language": "ja,en-US;q=0.9,en;q=0.8",
              "Cookie": "p_ab_d_id=1272411874; user_id=87842624;"
            }
          };

          https.get(url, options, (res) => {
            let html = "";
            res.on("data", chunk => html += chunk);
            res.on("end", () => {
              try {
                // 1. ピックアップセクションを抽出
                const pickupMatch = html.match(/<h2[^>]*>ピックアップ<\/h2>[\s\S]*?<\/section>/);
                const pickupSection = pickupMatch ? pickupMatch[0] : html;

                // 2. アイテムごとに分割
                const items = pickupSection.match(/<li[\s\S]*?<\/li>/g) || [];
                const pickupList = [];

                for (const item of items) {
                  // 作品リンク & IDの取得
                  const linkMatch = item.match(/href="https:\/\/www\.pixiv\.net\/(artworks\/(\d+)|novel\/show\.php\?id=(\d+))"/);
                  if (!linkMatch) continue;

                  const href = linkMatch[0].replace(/href="|"/g, "");
                  const isNovel = href.includes("/novel/");
                  const id = linkMatch[2] || linkMatch[3];

                  // タイトルの取得
                  let title = "無題";
                  const titleMatch = item.match(/<a[^>]*href="[^"]*(artworks\/\d+|novel\/show\.php\?id=\d+)"[^>]*>([^<]+)<\/a>/);
                  if (titleMatch && titleMatch[2]) {
                    title = titleMatch[2].trim();
                  } else {
                    const altMatch = item.match(/alt="([^"]+)"/);
                    if (altMatch) title = altMatch[1].replace(/ - おかずレシピの.*$/, "").replace(/^#.*? /, "").trim();
                  }

                  // R-18判定
                  let r18 = "";
                  if (item.includes("R-18G")) r18 = "R-18G";
                  else if (item.includes("R-18")) r18 = "R-18";

                  // メタ情報（枚数 or 文字数）
                  let meta = "";
                  const countMatch = item.match(/<span>(\d+)<\/span><\/div><\/div><\/div><\/a>/) || item.match(/<span>(\d+)<\/span>/);
                  const wordMatch = item.match(/([0-9,]+文字)/);
                  const timeMatch = item.match(/([0-9]+分)/);

                  if (isNovel && wordMatch) {
                    meta = wordMatch[1] + (timeMatch ? " / " + timeMatch[1] : "");
                  } else if (countMatch) {
                    meta = "イラスト " + countMatch[1] + "枚";
                  }

                  // サムネイル画像の処理
                  let img = "";
                  const imgMatch = item.match(/src="([^"]+)"/);
                  if (isNovel) {
                    // 小説に表紙がある場合のみ設定（なければ空にして金箔風カバーを適用）
                    if (imgMatch && imgMatch[1].includes("master1200")) {
                      img = "https://wsrv.nl/?url=" + encodeURIComponent(imgMatch[1]);
                    }
                  } else {
                    // イラストは pixiv.cat で高画質表示
                    img = "https://pixiv.cat/" + id + ".jpg";
                  }

                  pickupList.push({
                    id,
                    title,
                    type: isNovel ? "小説作品" : "イラスト作品",
                    href,
                    img,
                    r18,
                    pages: countMatch ? parseInt(countMatch[1], 10) : 1,
                    meta
                  });
                }

                // アバター画像URL
                const avatarMatch = html.match(/https:\/\/embed\.pixiv\.net\/user_profile\.php\?[^"]+/);
                const avatar = avatarMatch ? avatarMatch[0].replace(/&amp;/g, "&") : "https://embed.pixiv.net/user_profile.php?id=87842624";

                const result = {
                  avatar,
                  pickup: pickupList
                };

                fs.writeFileSync("pickup.json", JSON.stringify(result, null, 2));
                console.log("Successfully generated pickup.json with " + pickupList.length + " items.");
              } catch (err) {
                console.error("Parse Error:", err);
                process.exit(1);
              }
            });
          }).on("error", (err) => {
            console.error("HTTP Error:", err);
            process.exit(1);
          });
          '

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pickup.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto sync Pixiv pickup"
          git push
